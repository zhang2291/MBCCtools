# MBCCtools -> MaaFwApp Android 打包配方
# 资源项目根目录（相对本文件）
assets: ..

# 与资源发布清单的 UTC 时间版本保持一致，防止旧远端资源覆盖新 APK。
update:
  stampResourceVersion: true
  # GitHub releases for the MaaFwApp shell itself; PI resource updates still use interface.json.
  appGithubRepository: "zhang2291/MaaFwApp"

# 只把 Android 运行真正需要的 PI 和资源打进 APK
include:
  - interface.json
  - resource/**
  - agent/**

exclude:
  - agent/**/__pycache__/**
  - agent/**/*.pyc

app:
  id: mbcctools
  label: MBCCtools
  icon: app-icon.png

agent:
  sourceDir: agent-runtime
  abi: [arm64-v8a]
  runtimes:
    - location: bundle
      executable: bin/python3
      args: [-u, agent/main.py]
      env:
        MAAFW_BINARY_PATH: "{nativeLibs}"
        PYTHONHOME: "{bundle}/prefix"
        PYTHONPATH: "{bundle}/site-packages:{bundle}/site-packages/pure.zip"
        LD_LIBRARY_PATH: "{bundle}/prefix/lib:{bundle}/site-packages/numpy.libs:{bundle}/site-packages/chaquopy/lib:{nativeLibs}"
